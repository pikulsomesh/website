# After each push to main, tells Bing and the other IndexNow engines which pages changed.
# See tools/indexnow.mjs.
name: IndexNow

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/indexnow.mjs ${{ github.event.before }} ${{ github.sha }}
