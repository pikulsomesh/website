<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<rect width="1600" height="900" fill="#f6f5f2"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a8089"/></marker></defs>
<text x="48" y="64" font-size="30" fill="#131518" font-weight="600">Food Bank Spatial Twin: video to world model to Blender to AWS to Omniverse</text>
<rect x="40" y="100" width="1520" height="250" rx="18" fill="none" stroke="#d9d7d2" stroke-width="2" stroke-dasharray="8 6"/>
<text x="60" y="134" font-size="15" letter-spacing="2" fill="#c2410c" font-family="JetBrains Mono, ui-monospace, monospace">STEP 1 · CAPTURES FROM A PUBLIC VIDEO</text>
<rect x="70" y="150" width="280" height="170" rx="12" fill="#ffffff" stroke="#d9d7d2" stroke-width="1.5"/>
<text x="88" y="182" font-size="19" font-weight="600" fill="#131518">News tour (MP4)</text>
<text x="88" y="208" font-size="15" fill="#464b53">18 min, 1080p</text>
<text x="88" y="230" font-size="15" fill="#464b53">ffmpeg frames, sharpest</text>
<text x="88" y="252" font-size="15" fill="#464b53">per time bucket</text>
<text x="88" y="274" font-size="15" fill="#464b53">hosts + graphics masked</text>
<path d="M350 235L400 235" stroke="#7a8089" stroke-width="2" marker-end="url(#a)"/>
<rect x="400" y="150" width="340" height="170" rx="12" fill="#ffffff" stroke="#d9d7d2" stroke-width="1.5"/>
<text x="418" y="182" font-size="19" font-weight="600" fill="#131518">World model route</text>
<text x="418" y="208" font-size="15" fill="#464b53">pose: 20 frames → poses</text>
<text x="418" y="230" font-size="15" fill="#464b53">+ metric depth (200 credits)</text>
<text x="418" y="252" font-size="15" fill="#464b53">fuse locally: 1 cm voxels</text>
<text x="418" y="274" font-size="15" fill="#464b53">747k splats, 3 zones</text>
<path d="M740 235L790 235" stroke="#7a8089" stroke-width="2" marker-end="url(#a)"/>
<rect x="790" y="150" width="340" height="170" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="2.5"/>
<text x="808" y="182" font-size="19" font-weight="600" fill="#131518">Local 3DGS route</text>
<text x="808" y="208" font-size="15" fill="#464b53">COLMAP poses, 49–72 frames</text>
<text x="808" y="230" font-size="15" fill="#464b53">PyTorch rasterizer on CPU</text>
<text x="808" y="252" font-size="15" fill="#464b53">background plates + carving</text>
<text x="808" y="274" font-size="15" fill="#464b53">4 photoreal zones, 0 credits</text>
<path d="M1130 235L1180 235" stroke="#7a8089" stroke-width="2" marker-end="url(#a)"/>
<rect x="1180" y="150" width="350" height="170" rx="12" fill="#ffffff" stroke="#d9d7d2" stroke-width="1.5"/>
<text x="1198" y="182" font-size="19" font-weight="600" fill="#131518">OpenUSD captures</text>
<text x="1198" y="208" font-size="15" fill="#464b53">ParticleField3DGaussianSplat</text>
<text x="1198" y="230" font-size="15" fill="#464b53">metres, Y up, floor at y = 0</text>
<text x="1198" y="252" font-size="15" fill="#464b53">.spz for the browser</text>
<text x="1198" y="274" font-size="15" fill="#464b53">.usdz for Omniverse</text>
<rect x="40" y="380" width="740" height="250" rx="18" fill="none" stroke="#d9d7d2" stroke-width="2" stroke-dasharray="8 6"/>
<text x="60" y="414" font-size="15" letter-spacing="2" fill="#c2410c" font-family="JetBrains Mono, ui-monospace, monospace">STEP 1B · THE BUILDING</text>
<rect x="70" y="430" width="680" height="170" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="2.5"/>
<text x="88" y="462" font-size="19" font-weight="600" fill="#131518">Blender, headless (bpy)</text>
<text x="88" y="488" font-size="15" fill="#464b53">footprints from operations.json → shell, cold rooms, racking,</text>
<text x="88" y="510" font-size="15" fill="#464b53">sorting lines, market, kitchen annex, forklifts</text>
<text x="88" y="532" font-size="15" fill="#464b53">one scene → facility.glb (1.8 MB, ~150 draw calls) + facility.usdz</text>
<text x="88" y="554" font-size="15" fill="#464b53">twin.usda = facility + captures (placed, cropped) + operations</text>
<rect x="820" y="380" width="740" height="250" rx="18" fill="none" stroke="#d9d7d2" stroke-width="2" stroke-dasharray="8 6"/>
<text x="840" y="414" font-size="15" letter-spacing="2" fill="#c2410c" font-family="JetBrains Mono, ui-monospace, monospace">STEP 2 · DATA ON AWS (SAM)</text>
<rect x="850" y="430" width="680" height="170" rx="12" fill="#ffffff" stroke="#d9d7d2" stroke-width="1.5"/>
<text x="868" y="462" font-size="19" font-weight="600" fill="#131518">S3 + HTTP API + Lambda</text>
<text x="868" y="488" font-size="15" fill="#464b53">GET /telemetry · /operations · /health, 5 rps throttle</text>
<text x="868" y="510" font-size="15" fill="#464b53">Python 3.12, arm64, 128 MB, 3 s timeout, no database</text>
<text x="868" y="532" font-size="15" fill="#464b53">same metric frame as the USD; simulated: true</text>
<text x="868" y="554" font-size="15" fill="#464b53">real path (designed): LoRaWAN/BLE → IoT Core → DynamoDB</text>
<rect x="40" y="660" width="1520" height="200" rx="18" fill="none" stroke="#d9d7d2" stroke-width="2" stroke-dasharray="8 6"/>
<text x="60" y="694" font-size="15" letter-spacing="2" fill="#c2410c" font-family="JetBrains Mono, ui-monospace, monospace">STEP 3 · VIEW IT ANYWHERE</text>
<rect x="70" y="710" width="460" height="120" rx="12" fill="#ffffff" stroke="#d9d7d2" stroke-width="1.5"/>
<text x="88" y="742" font-size="19" font-weight="600" fill="#131518">Browser</text>
<text x="88" y="768" font-size="15" fill="#464b53">three.js + Spark on GitHub Pages</text>
<text x="88" y="790" font-size="15" fill="#464b53">polls the API, falls back offline</text>
<rect x="570" y="710" width="460" height="120" rx="12" fill="#ffffff" stroke="#d9d7d2" stroke-width="1.5"/>
<text x="588" y="742" font-size="19" font-weight="600" fill="#131518">Omniverse on EC2</text>
<text x="588" y="768" font-size="15" fill="#464b53">g6.xlarge (L4) or g5.xlarge</text>
<text x="588" y="790" font-size="15" fill="#464b53">self-terminating, ~$1.34 for 7 runs</text>
<rect x="1070" y="710" width="460" height="120" rx="12" fill="#ffffff" stroke="#d9d7d2" stroke-width="1.5"/>
<text x="1088" y="742" font-size="19" font-weight="600" fill="#131518">Blender / usdview</text>
<text x="1088" y="768" font-size="15" fill="#464b53">same twin.usda</text>
<text x="1088" y="790" font-size="15" fill="#464b53">Cycles stills on a laptop</text>
<path d="M410 600L410 660" stroke="#7a8089" stroke-width="2" marker-end="url(#a)"/>
<path d="M1190 600L1190 660" stroke="#7a8089" stroke-width="2" marker-end="url(#a)"/>
</svg>
